[project]
name = "jev-developer"
version = "0.2.0"
description = "JEV-Developer: offline-first AI CLI coding agent with typed tool calls and guardrails."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28,<1", "rich>=13,<14", "typer>=0.12,<1", "pyyaml>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8"]

[project.scripts]
jev-dev = "jev_developer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_developer"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
